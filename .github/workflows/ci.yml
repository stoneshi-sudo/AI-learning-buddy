name: CI/CD

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Check backend TypeScript
      run: |
        cd backend
        npx tsc --noEmit

    - name: Create data directory
      run: mkdir -p backend/data

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: frontend/dist/

  integration:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install all dependencies
      run: |
        cd backend && npm ci && cd ..
        cd frontend && npm ci && cd ..

    - name: Start backend server
      run: |
        cd backend
        npm run dev &
        sleep 10
      env:
        PORT: 3001
        DATABASE_PATH: ./data/learning.db

    - name: Health check
      run: |
        curl -f http://localhost:3001/api/health || exit 1

    - name: Check API endpoints
      run: |
        curl -f http://localhost:3001/api/questions || exit 1
